name: Design data QA
on:
  push:
    branches: ["main", "design/**", "feature/**"]
  pull_request:
    branches: ["main"]
jobs:
  test-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run validate
