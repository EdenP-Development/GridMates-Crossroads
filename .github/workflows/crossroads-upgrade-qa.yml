name: Crossroads real APK install-over QA
on:
  push:
    branches: ["design/**", "feature/**"]
    paths:
      - ".github/workflows/crossroads-upgrade-qa.yml"
      - ".github/scripts/crossroads_upgrade_emulator.py"
  workflow_dispatch:
    inputs:
      base_run:
        description: "Previous QA run ID"
        type: string
        default: "44971128199"
      base_name:
        description: "Previous artifact name"
        type: string
        default: "Crossroads-Android-QA-1607-324cf2b4232df4d36287c4134ae0ae143c172b4f"
      base_code:
        description: "Previous Android versionCode"
        type: string
        default: "1607"
      base_sha:
        description: "Previous exact APK SHA-256"
        type: string
        default: "b926e01bc0066a5e71140f9241f4b21f49e6aa799acaca2fef180b0679086dca"
      next_run:
        description: "Candidate QA run ID"
        type: string
        default: "45027345072"
      next_name:
        description: "Candidate artifact name"
        type: string
        default: "Crossroads-Android-QA-1613-4924a8862d23e0ac9ad53f2357a9bac69043fb8e"
      next_code:
        description: "Candidate Android versionCode"
        type: string
        default: "1613"
      next_sha:
        description: "Candidate exact APK SHA-256"
        type: string
        default: "c42054e446c35e0b805ac69950e1ee478c39eb0058d32ff0290e8389f0f94779"
permissions:
  contents: read
  actions: read
# Save CI minutes when an in-progress upgrade check is superseded on this branch.
concurrency:
  group: crossroads-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-preserves-profile:
    # VISUAL-85's push uses this established runner solely to capture the
    # already-built exact QA1672 art pair; regular QA upgrade stays unchanged.
    if: github.ref != 'refs/heads/feature/visual-85-exact-apk-overhead-screenshot-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_CODE: ${{ inputs.base_code || '1607' }}
      NEXT_CODE: ${{ inputs.next_code || '1613' }}
      BASE_SHA: ${{ inputs.base_sha || 'b926e01bc0066a5e71140f9241f4b21f49e6aa799acaca2fef180b0679086dca' }}
      NEXT_SHA: ${{ inputs.next_sha || 'c42054e446c35e0b805ac69950e1ee478c39eb0058d32ff0290e8389f0f94779' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base_name || 'Crossroads-Android-QA-1607-324cf2b4232df4d36287c4134ae0ae143c172b4f' }}
          run-id: ${{ inputs.base_run || '44971128199' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/base
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.next_name || 'Crossroads-Android-QA-1613-4924a8862d23e0ac9ad53f2357a9bac69043fb8e' }}
          run-id: ${{ inputs.next_run || '45027345072' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/next
      - name: Verify distinct prior and candidate APK identity/checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_CODE" =~ ^[0-9]+$ && "$NEXT_CODE" =~ ^[0-9]+$ ]] || exit 1
          (( NEXT_CODE > BASE_CODE )) || { echo "Candidate must be a higher versionCode"; exit 1; }
          [[ "$BASE_SHA" =~ ^[[:xdigit:]]{64}$ && "$NEXT_SHA" =~ ^[[:xdigit:]]{64}$ ]] || exit 1
          echo "$BASE_SHA  qa-archives/base/GridMates-Crossroads-QA-$BASE_CODE.apk" | sha256sum -c
          echo "$NEXT_SHA  qa-archives/next/GridMates-Crossroads-QA-$NEXT_CODE.apk" | sha256sum -c
      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QA1607, roll genuine match, update to QA1613 and verify recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/crossroads_upgrade_emulator.py
      - name: Upload source-matched emulator visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Crossroads-Upgrade-Emulator-${{ env.BASE_CODE }}-to-${{ env.NEXT_CODE }}-${{ github.sha }}
          path: |
            qa-evidence/*.png
            qa-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14

  exact-art-compare:
    if: github.ref == 'refs/heads/feature/visual-85-exact-apk-overhead-screenshot-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      QA_CODE: "1672"
      QA_SHA: "f4a27d23a7ac9ba9a8efef6b5c1fdb441c7b236bf2200398ebe95edac44ffeba"
    steps:
      - uses: actions/checkout@v4
      - name: Download signed exact-head QA1672 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: "45072993375"
          name: Crossroads-Android-QA-1672-3f642a372625e1616dca2222cae55d15c8f5d42b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/current
      - name: Verify immutable source-matched QA APK and syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "$QA_SHA  qa-archives/current/GridMates-Crossroads-QA-$QA_CODE.apk" | sha256sum -c
          python3 -m py_compile .github/scripts/crossroads_board_visual_qa.py
      - name: Enable emulator KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture identical saved race in Storybook and Overhead
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/crossroads_board_visual_qa.py
      - name: Upload actual Android screenshots and comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Crossroads-VISUAL85-exact-QA1672-art-compare-${{ github.sha }}
          path: |
            qa-evidence/*.png
            qa-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
