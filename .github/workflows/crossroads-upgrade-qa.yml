name: Crossroads real APK install-over QA
on:
  push:
    branches: ["design/**", "feature/**"]
    paths:
      - ".github/workflows/crossroads-upgrade-qa.yml"
      - ".github/scripts/crossroads_upgrade_emulator.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  update-preserves-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Crossroads-Android-QA-1008-c189ca9efeb01ba1b2a27f98fce07fa780be3425
          run-id: 43995150638
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/v1008
      - uses: actions/download-artifact@v4
        with:
          name: Crossroads-Android-QA-1009-ad7e6acb9a4b8eb87337623fc6c72e888794129b
          run-id: 43995157650
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/v1009
      - name: Verify *actual* prior and candidate binaries
        shell: bash
        run: |
          echo "6cb6e89128d7f3a5ed123f38ebd5878f2775e200898f6ee8a4379dbbdf01354d  qa-archives/v1008/GridMates-Crossroads-QA-1008.apk" | sha256sum -c
          echo "78ed337d05b9c6ea0d01f00d464ecf9eba6c164557a6b7e7e9b2cad2ada21d3b  qa-archives/v1009/GridMates-Crossroads-QA-1009.apk" | sha256sum -c
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install 1008, seed profile, update to 1009, verify persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/crossroads_upgrade_emulator.py
