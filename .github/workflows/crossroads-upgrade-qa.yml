name: Crossroads real APK install-over QA
on:
  push:
    branches: ["design/**", "feature/**"]
    paths:
      - ".github/workflows/crossroads-upgrade-qa.yml"
      - ".github/scripts/crossroads_upgrade_emulator.py"
  workflow_dispatch:
    inputs:
      base_run:
        description: "Previous QA run ID"
        type: string
        default: "44007530364"
      base_name:
        description: "Previous artifact name"
        type: string
        default: "Crossroads-Android-QA-1044-271eada0aacad22562c7b4a394f6c7263e4ea39a"
      base_code:
        description: "Previous Android versionCode"
        type: string
        default: "1044"
      base_sha:
        description: "Previous exact APK SHA-256"
        type: string
        default: "cf521f23096051eb32cc378c2b5cf1c5d3224d5e7acee31ef54a076a9d18f0a6"
      next_run:
        description: "Candidate QA run ID"
        type: string
        default: "44011268890"
      next_name:
        description: "Candidate artifact name"
        type: string
        default: "Crossroads-Android-QA-1051-9fa0836db9f3666de34bef57eb4a14f142c97943"
      next_code:
        description: "Candidate Android versionCode"
        type: string
        default: "1051"
      next_sha:
        description: "Candidate exact APK SHA-256"
        type: string
        default: "4a9728a48551cac471ee384ebe7fa7282c36ed86f97e4fd6e9b6457b937361d7"
permissions:
  contents: read
  actions: read
jobs:
  update-preserves-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_CODE: ${{ inputs.base_code || '1044' }}
      NEXT_CODE: ${{ inputs.next_code || '1051' }}
      BASE_SHA: ${{ inputs.base_sha || 'cf521f23096051eb32cc378c2b5cf1c5d3224d5e7acee31ef54a076a9d18f0a6' }}
      NEXT_SHA: ${{ inputs.next_sha || '4a9728a48551cac471ee384ebe7fa7282c36ed86f97e4fd6e9b6457b937361d7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base_name || 'Crossroads-Android-QA-1044-271eada0aacad22562c7b4a394f6c7263e4ea39a' }}
          run-id: ${{ inputs.base_run || '44007530364' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/base
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.next_name || 'Crossroads-Android-QA-1051-9fa0836db9f3666de34bef57eb4a14f142c97943' }}
          run-id: ${{ inputs.next_run || '44011268890' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-archives/next
      - name: Verify distinct prior and candidate APK identity/checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_CODE" =~ ^[0-9]+$ && "$NEXT_CODE" =~ ^[0-9]+$ ]] || exit 1
          (( NEXT_CODE > BASE_CODE )) || { echo "Candidate must be a higher versionCode"; exit 1; }
          [[ "$BASE_SHA" =~ ^[[:xdigit:]]{64}$ && "$NEXT_SHA" =~ ^[[:xdigit:]]{64}$ ]] || exit 1
          echo "$BASE_SHA  qa-archives/base/GridMates-Crossroads-QA-$BASE_CODE.apk" | sha256sum -c
          echo "$NEXT_SHA  qa-archives/next/GridMates-Crossroads-QA-$NEXT_CODE.apk" | sha256sum -c
      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install previous APK, seed stats, update APK, capture Woven Trail
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/crossroads_upgrade_emulator.py
      - name: Upload source-matched emulator visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Crossroads-Upgrade-Emulator-${{ env.BASE_CODE }}-to-${{ env.NEXT_CODE }}-${{ github.sha }}
          path: qa-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
